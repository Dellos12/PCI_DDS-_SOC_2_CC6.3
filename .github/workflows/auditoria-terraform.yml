name: "Orquestrador de Infraestrutura Segura"

# O pipeline roda a cada Pull Request enviado para a branch principal
on:
  pull_request:
    branches:
      - main

jobs:
  auditoria_e_plan:
    name: "Validar Conformidade e Gerar Plano"
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o download do seu código do repositório para o executor
      - name: Checkout Código
        uses: actions/checkout@v4

      # 2. Instala e configura o Terraform na máquina do GitHub
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      # 3. Instala o OPA (Open Policy Agent) na máquina do GitHub
      - name: Configurar OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # 4. Inicializa o Terraform
      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 5. Cria o plano técnico e exporta em formato binário econômico (tfplan)
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 6. Converte o binário do plano para JSON legível por humanos e pelo OPA
      - name: Converter Plano para JSON
        run: terraform show -json tfplan > tfplan.json

      # 7. A VÁLVULA DE SEGURANÇA: OPA avalia o plano contra as regras de SOC 2 / PCI-DSS
      - name: Executar Auditoria OPA
        run: |
          echo "🔍 Iniciando auditoria automatizada de conformidade..."
          
          # Executa o OPA e captura os erros encontrados na política rego
          ERROS=$(opa eval -i tfplan.json -d politica.rego "data.main.violations" --format pretty)
          
          # Se a lista de erros não estiver vazia (ou seja, não for []), falha o pipeline
          if [ "$ERROS" != "[]" ] && [ "$ERROS" != "" ]; then
            echo "❌ CONFORMIDADE NEGADA! Foram encontradas violações de segurança:"
            echo "$ERROS"
            exit 1
          fi
          
          echo "✅ CONFORMIDADE APROVADA! Nenhum risco crítico detectado."
